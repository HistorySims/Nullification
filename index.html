async function feelOut(who){
  const S = G.S; S.feelWho = who;
  let st = feelStart(S, who), line = st.line, tell = st.tell, left = st.left, mode = "main", outcome = "spent";
  try{
    for(;;){
      feelPanel(who, line, tell, left, mode);
      const b = await waitAny("#side .feelchoices .btn"); const ap = b.dataset.ap;
      if(ap === "leave"){ outcome = "left"; break; }
      if(ap === "news"){ mode = "facts"; continue; }
      if(ap === "back"){ mode = "main"; continue; }
      const [kind, fid] = ap.split(":");
      const r = beat(S, who, kind, fid); mode = "main";
      line = r.line; tell = r.tell; left = r.left; renderAll();
      if(r.cls === "better") sfx.good(); else if(r.cls === "worse") sfx.bad(); else sfx.click();
      if(r.blown){ feelPanel(who, line, tell, left, "done"); await sleep(FAST ? 0 : 900); outcome = "blown"; break; }
      if(r.opening){ outcome = "open"; break; }
      if(left <= 0){ feelPanel(who, line, tell, left, "done"); await sleep(FAST ? 0 : 700); outcome = "spent"; break; }
    }
  } finally { S.feelWho = null; }
  if(outcome === "open"){
    const op = feelOpen(S, who);
    await say(who, [[op.line, "warm"]], {sub:ROLE[who], last:op.deal ? "Make an offer" : "Done"});
    return op.deal ? {deal:true, menu:op.menu} : {deal:false};
  }
  if(outcome === "blown"){ await say(who, [[FEEL[who].blow, "angry"]], {last:"Done"}); sfx.bad(); toast(NAMES[who] + " has had enough. Try again another night.", 4200); return {deal:false}; }
  if(outcome === "left"){ toast("You walk away. He remembers how you left things.", 3600); return {deal:false}; }
  await say(who, [["He will not move tonight. But now you know him better.", "neutral"]], {last:"Done"});
  return {deal:false};
}

async function menuTalk(who){
  const S = G.S, mid = talkTo(S, who); if(!mid){ toast("You have already spoken to him."); return; }
  const M = MENU[mid], lines = M.lines.map((t, i) => [t, i === 0 ? "warm" : "neutral"]);

  for(;;){
    sideSet(`<div class="talkview"><div class="sceneBox">${sceneSVG(who, "neutral")}</div><p>${real ? "What will you say?" : ""}</p><div class="choices" data-menu="${mid}">${M.options.map(o => optionHTML(S, o, M)).join("")}</div></div>`);
    const b = await waitAny("#side .choices .btn:not([disabled])"); const o = M.options.find(x => x.id === b.dataset.o);

      overlay(`<h2>How do you say it?</h2><div class="choices"><button class="btn" id="sAloud">Say it in public<small>Everyone hears it, so no one can quietly drop it. ${esc(ofText)}</small></button><button class="btn" id="sFan">Say it in private<small>No one repeats it. But a private promise can become weak overnight. You may need to spend a move to make it strong.</small></button></div>`);
      const c = await Promise.race([waitBtn("sAloud"), waitBtn("sFan")]); closeOverlay(); scope = c === "sFan" ? "private" : "witnessed";
    }

      const owner = PROMISE_ORDER.filter(p => S.promises[p] && S.promises[p].state === "open" && ((PROMISES[p].pledges || []).includes(res.conflict.with) || (PROMISES[p].any || []).includes(res.conflict.with))).map(p => PROMISES[p].short);
      overlay(`<h2>That breaks a promise you made.</h2><p>You already promised: <i>${esc(PLEDGE_TEXT[res.conflict.with])}</i></p><p>${owner.length ? "If you break it, this promise to you will fall apart: " + esc(owner.join("; ")) + ". " : ""}Their friends will trust you less, and war will feel closer. By morning, everyone will know.</p><div class="row"><button class="btn ghost" id="cNo">Keep my promise</button><button class="btn" id="cYes">Break it</button></div>`);
      const c = await Promise.race([waitBtn("cYes"), waitBtn("cNo")]); closeOverlay();

      res = choose(S, mid, o.id, {breakOld:true, scope}); sfx.bad();
    }

    renderAll();

    if(res.promise){ sfx.promise(); toast("Promise: " + PROMISES[res.promise].short + "."); }

  }
}

function hintOverlay(){
  if($("#overlay").classList.contains("on")) return;
  const text = nextHint(G.S, G.S.feelWho ? "feel" : G.phase);
  overlay(`<h2>Hint</h2><p>${esc(text)}</p><div class="row"><button class="btn" id="hGo">Got it</button></div>`);
  waitBtn("hGo").then(closeOverlay);
}

/* ---------- the promise book and the notebook ---------- */
function bookOverlay(){
  const S = G.S;
  const owed = PROMISE_ORDER.filter(p => S.promises[p]).map(p => {
    const P = PROMISES[p], pr = S.promises[p], ok = committed(S, p);
    const st = pr.state === "broken" ? "Broken" : pr.state === "lost" ? "Lost" : ok ? (pr.shaky ? "Weak" : "Standing") : "Waiting";
    const why = pr.state === "lost" ? "It faded overnight. You did not make it strong." : pr.state === "broken" ? "You broke an earlier promise, so this fell apart." : ok && pr.shaky ? "Weak: the other side is working on it. Spend a move to make it strong, or make it public." : ok ? "Everything it needs is in place so far." : "Waiting on: " + [].concat((P.pledges || []).filter(x => !S.pledges[x]).map(x => PLEDGE_TEXT[x].replace(/^You /, "your promise: ")), (P.needsP || []).filter(q => !committed(S, q)).map(q => PROMISES[q].short)).join("; ");
    return `<li class="pc ${st.toLowerCase()}"><b>${esc(P.short)}</b> <span class="chip2">${st}</span> <span class="chip2 sc">${pr.scope === "witnessed" ? "public" : "private"}</span><br><small>${esc(P.text)}</small><br><small>${esc(why)}</small></li>`;
  });
  const owe = Object.keys(S.pledges).map(p => `<li>${esc(PLEDGE_TEXT[p] || p)} <small>(${S.pledges[p].scope === "witnessed" ? "said in public" : "said in private"})</small></li>`);
  overlay(`<h2>Promise book</h2><h3>Promises made to you</h3>${owed.length ? `<ul class="book">${owed.join("")}</ul>` : "<p class=\"small\">Nothing yet. Go to a party.</p>"}<h3>Promises you made</h3>${owe.length ? `<ul class="book">${owe.join("")}</ul>` : "<p class=\"small\">Nothing yet.</p>"}${S.debts.length ? `<h3>Favors you owe</h3><ul class="book">${S.debts.map(d => `<li>${esc(d.text)}</li>`).join("")}</ul>` : ""}<div class="row"><button class="btn" id="mGo">Close</button></div>`);
  waitBtn("mGo").then(closeOverlay);
}
function notebook(){
  sideSet(`<div class="notebook"><h2>Notebook</h2><h3>How to play</h3><p><b>Your goal:</b> stop a war before March 3. You need Jackson’s promise, Calhoun’s promise, and 25 votes.</p><p><b>Every morning</b>, read the newspaper. It changes everyone’s mood. It also gives you news you can use.</p><p><b>By day</b>, tap a leader on the floor. Ask what he wants. Once he has promised you something, ask him to bring his friends.</p><p><b>At night</b>, go to one party. Someone asks you a hard question. Then talk to the men you need. At first, each man says no. <b>Feel him out.</b> Press him, honor him, or calm him, or use the news. Watch his face and his tells. If you push too hard, he leaves. When he is ready, he asks what you propose, and you can make a deal.</p><p>A promise made <b>in public</b> is strong, but the other side hears about it. A promise made <b>in private</b> can become <b>weak</b> overnight. Spend a move to make it strong again.</p><h3>Words to know</h3><dl>${GLOSS.map(([w, d]) => `<dt>${esc(w)}</dt><dd>${esc(d)}</dd>`).join("")}</dl><button class="btn ghost wide" id="nbPro" style="margin-top:8px">Watch the prologue again</button><button class="btn ghost wide" id="nbBack" style="margin-top:8px">Back to the floor</button></div>`);
  $("#nbBack").onclick = () => G.phase === "evening" ? invitesPanel() : dayPanel();
  $("#nbPro").onclick = async () => { if(G.busy) return; G.busy = true; await playCinema("prologue"); G.busy = false; };
}

/* ---------- story sequences ---------- */
let _cin = null;
function ensureCinema(){
  if(_cin) return _cin;
  const f = document.createElement("iframe"); f.id = "cinema"; f.title = "Story sequence"; f.setAttribute("allow", "autoplay"); f.srcdoc = CINEMA_HTML;
  document.body.appendChild(f); _cin = f; return f;
}
function playCinema(name, data){
  return new Promise(res => {
    const f = ensureCinema();
    const onMsg = e => { const m = e.data || {}; if(m.evt === name + ":done"){ removeEventListener("message", onMsg); f.classList.remove("on"); document.body.classList.remove("cin"); res(); } };
    addEventListener("message", onMsg);
    const go = () => { f.classList.add("on"); document.body.classList.add("cin"); f.contentWindow.postMessage({cmd:"play", seq:name, data:data || null}, "*"); try{ f.contentWindow.focus(); }catch(e){} };
    if(f.dataset.ready) go(); else f.addEventListener("load", () => { f.dataset.ready = "1"; go(); }, {once:true});
  });
}
function replayUrl(){ const u = new URL(location.href); u.searchParams.set("replay", "1"); ["seed", "skip"].forEach(k => u.searchParams.delete(k)); return u.toString(); }

const ENDINGS = {
  compromise:{title:"Peace by compromise", blurb:"This is what really happened. Congress passed a slow tariff cut and the Force Bill together. Jackson signed both on March 2, 1833. South Carolina took back its law on March 15. Three days later, it passed a new law that cancels the Force Bill, but that law was never used. No shots were fired."},
  war:{title:"Shots at Charleston", blurb:"In real life, no shots were fired in 1833. Here, the crisis turned into a war. This is imagination, not history."},
  bluff:{title:"South Carolina backs down", blurb:"In real life, Congress passed a tariff cut and the Force Bill together. Here, only the Force Bill passed, and South Carolina backed down. This is imagination, not history."}
};
async function endingFlow(name){
  const S = G.S; G.phase = "over"; G.busy = true; closeOverlay();
  window.dispatchEvent(new CustomEvent("act2:complete", {detail:{ending:name, round:S.round}}));
  const data = {why:S.why || [], round:S.round, cwalk:!!S.flags.cwalked, E:S.E};
  if(name !== "compromise"){
    const dg = diagnose(S);
    overlay(`<h2>${name === "war" ? "Why it fell apart" : "How you got here"}</h2><ul>${dg.map(x => `<li>${esc(x)}</li>`).join("") || "<li>You took a path few players find.</li>"}</ul><div class="row"><button class="btn" id="mGo">See what happens</button></div>`);
    await waitBtn("mGo"); closeOverlay();
  }
  if(!params.get("nocine")) await playCinema("end_" + name, data);
  G.busy = false; showDebrief(name);
}
const DQ = [
  ["Which promise was hardest for you to make or keep? Who paid for it?", "The hardest was ___ because ___. ___ paid for it."],
  ["Public speeches were locked on the floor, but promises were made at parties. Which was stronger? Why?", "I think ___ was stronger because ___."],
  ["The women who hosted the parties decided who could talk to whom. Was that real power, even though women could not vote? Give an example.", "I think it was / was not real power because ___. For example, ___."],
  ["Which ending would you defend as the right one? Who was left out? (In 1830, 315,401 of South Carolina’s 581,185 people were enslaved. None of them sat at any table.)", "I would defend ___ because ___. It left out ___."]
];
function showDebrief(name){
  const S = G.S, E = ENDINGS[name]; let d = $("#debrief"); if(d) d.remove();
  const rows = PROMISE_ORDER.filter(p => S.promises[p]).map(p => `<tr><td>${esc(PROMISES[p].short)}</td><td>${S.promises[p].state === "broken" ? "Broken" : executed(S, p) ? "Kept" : committed(S, p) ? "Not needed" : "Fell through"}</td></tr>`).join("");
  d = document.createElement("div"); d.id = "debrief"; d.setAttribute("role", "dialog"); d.setAttribute("aria-label", "Debrief");
  d.innerHTML = `<div class="dpage"><header class="dhead"><div><h1 tabindex="-1">Nullification, 1833</h1><p class="dsub">Debrief for Senator Henry Clay. “Nullification” means a state tries to cancel a federal law.</p></div><label class="dname">Name <input id="dName" type="text" autocomplete="off" maxlength="60"></label></header>
    <section class="dgrid">
      <div class="dbox"><h2>Your ending: ${esc(E.title)}</h2><p>${esc(E.blurb)}</p></div>
      <div class="dbox"><h2>Your promises</h2>${rows ? `<table class="dt"><tbody>${rows}</tbody></table>` : "<p>You made no promises.</p>"}<p>You spent ${S.maxFavors - S.favors} of ${S.maxFavors} favors. You broke ${S.stats.broken} promise${S.stats.broken === 1 ? "" : "s"}.</p></div>
      <div class="dbox"><h2>Your standing</h2><ul><li>Peggy’s friends: ${S.trustA} of 6</li><li>Floride’s friends: ${S.trustB} of 6</li><li>War danger at the end: ${S.E.toFixed(0)} of 10</li><li>Level: ${S.mode === "guided" ? "Guided" : "Challenge"}${S.mode === "guided" ? ". Hints used: " + S.stats.hints : ""}</li></ul>${S.debts.length ? `<p>Favors you owe:</p><ul>${S.debts.map(x => `<li>${esc(x.text)}</li>`).join("")}</ul>` : ""}</div>
      ${name !== "compromise" ? `<div class="dbox"><h2>Why it ended this way</h2><ul>${diagnose(S).map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : ""}
      <div class="dbox"><h2>What was real</h2><ul><li>The Eaton affair, the end of Jackson’s cabinet in 1831, and Jackson’s fight with Calhoun are real.</li><li>November 24, 1832: South Carolina says the tariff law does not count. February 12, 1833: Clay offers a slow cut. March 2: Jackson signs the cut and the Force Bill. March 15 and 18: South Carolina takes back its law, then passes a law that cancels the Force Bill.</li><li>Jackson and Clay never talked like this. Jackson sent his demands through friends. The opening scene is imagined from his real words.</li><li>Sally and Beatrice, the parties in this game, and the foreign minister’s dinner are made up.</li></ul></div>
    </section>
    <section class="dbox"><h2>Think about it</h2><ol class="dq">${DQ.map(q => `<li><p>${esc(q[0])}</p><p class="hint">Sentence starter: ${esc(q[1])}</p><textarea rows="4" aria-label="${esc(q[0])}"></textarea></li>`).join("")}</ol></section>
    <footer class="dbtns"><button class="btn" id="dPrint">Print or save as PDF</button><button class="btn ghost" id="dWatch">Watch the ending again</button><button class="btn ghost" id="dAgain">Play again</button></footer></div>`;
  document.body.appendChild(d); d.scrollTop = 0;
  $("#dPrint").onclick = () => print();
  $("#dAgain").onclick = () => { location.href = replayUrl(); };
  $("#dWatch").onclick = async () => { d.style.display = "none"; await playCinema("end_" + name, {why:S.why || [], round:S.round, cwalk:!!S.flags.cwalked, E:S.E}); d.style.display = ""; };
  const h = $("h1", d); if(h) h.focus({preventScroll:true});
}

/* ---------- opening ---------- */
const BRIEF = [
  "Your goal is to stop a war before Congress ends on March 3. Jackson will not move on the tariff until Congress lets him use the army. Calhoun cannot sit and watch that happen. Both are proud, and both are ready to fight.",
  "At first, every man will say no. But each one is also proud, or afraid, or angry. At a party, you can press him, honor him, or calm him, or use the day’s news. Read his face and his tells. Find out how far you can push before he blows up. A man under pressure may come up with a way out himself.",
  "Two years ago, a fight about Peggy Eaton, the wife of a cabinet member, split Washington in two. Jackson’s friends and Calhoun’s friends no longer sit at the same table. You are a guest, not a host. The women who run the parties decide who can meet whom, and what news spreads.",
  "A promise made in public is strong, but the other side hears about it. A promise made in private can become weak overnight. Use a move to make it strong again. Every morning, the newspaper brings news. Some of it is real, and some is made up for the game."
];
const JACKSON = {
  lines:[
    ["Mr. Clay. Sit. I will be short.", "neutral"],
    ["Nullification is not real. A state cannot cancel a law of the United States. Not South Carolina. Not any state.", "angry"],
    ["I want the Force Bill. Not one inch of the tariff until Congress says, in plain words, that I may use the army to enforce the law.", "angry"]
  ],
  options:[
    {id:"a", label:"Mr. President, an army in Carolina means war.", sub:"Honest, and it will make him angrier."},
    {id:"b", label:"Give me time. I will find another way.", sub:"Calm, and a little calmer for him."},
    {id:"c", label:"Then pass your bill. I will not stand in your way.", sub:"Easy for now. The South will remember."}
  ],
  reply:{
    a:["Then you fix it, sir. You have until Congress ends on March 3.", "But if you do not, I will send the army. And if blood is shed, I will hang every one of these men, if I have to."],
    b:["Then fix it, sir. You have until Congress ends on March 3.", "But if you do not, I will send the army. And if blood is shed, I will hang every one of these men, if I have to."],
    c:["Good. But do not mistake me. If you want a tariff cut, you will have to bring me a way. You have until March 3.", "And if blood is shed, I will hang every one of these men, if I have to."]
  }
};
async function jacksonScene(){
  const S = G.S;
  overlay(`<h2>The White House, January 1833</h2><p>This scene is imagined. In real life, Jackson would not see Clay. He sent his demands through friends. His positions are real. The threat to hang the leaders was reported, but no one can prove he said it.</p><div class="row"><button class="btn" id="mGo">Go in</button></div>`);
  await waitBtn("mGo"); closeOverlay();
  await say("jackson", JACKSON.lines, {sub:"President of the United States", last:"Next"});
  sideSet(`<div class="talkview"><div class="sceneBox">${sceneSVG("jackson", "angry")}</div><p>How do you answer?</p><div class="choices">${JACKSON.options.map(o => `<button class="btn" data-o="${o.id}">${esc(o.label)}<small>${esc(o.sub)}</small></button>`).join("")}</div></div>`);
  const b = await waitAny("#side .choices .btn"); const id = b.dataset.o;
  openingReply(S, id); renderAll();
  await say("jackson", JACKSON.reply[id].map((t, i) => [t, i ? "angry" : "neutral"]), {sub:"President of the United States", last:"I understand"});
  sfx.gavel();
}
async function opening(){
  if(params.get("replay") || params.get("skip")){ await startRound(); return; }
  G.busy = true;
  if(!params.get("nocine")) await playCinema("prologue");
  ac(); sfx.gavel();
  for(let i = 0; i < BRIEF.length; i++){
    overlay(`<p id="bp" style="min-height:7em;font-size:1.1rem"></p><div class="row"><button class="btn" id="bn" disabled>${i < BRIEF.length - 1 ? "Continue" : "Begin"}</button></div>`);
    const T = typer($("#bp"), BRIEF[i], 60); $("#bp").onclick = () => T.skip();
    await new Promise(r => T.onDone(r)); $("#bn").disabled = false; $("#bn").focus();
    await waitBtn("bn");
  }
  await jacksonScene();
  if(!params.get("mode")){
    overlay(`<h2>Choose your level</h2><div class="choices"><button class="btn" id="lvG">Guided<small>Hints, a ★ on good choices, and gentler rules. Best for a first game.</small></button><button class="btn ghost" id="lvC">Challenge<small>No hints. Harder rules.</small></button></div>`);
    const c = await Promise.race([waitBtn("lvG"), waitBtn("lvC")]);
    if(c === "lvC"){ setLevel(G.S, "challenge"); const hb = $("#hHint"); if(hb) hb.remove(); renderAll(); }
  }
  closeOverlay(); await startRound();
}
function boot(){
  if(window.__booted) return; window.__booted = true;
  newG(); shell(); renderAll();
  window.__G = G; window.__T = {hintOverlay, startRound, captainTalk, evening, partyFlow, menuTalk, forceVoteFlow, tariffVoteFlow, endingFlow, showDebrief, playCinema, renderAll, nightFlow, dayPanel, invitesPanel, feelOut, goalOverlay, slightFlow, gossipFlow, bookOverlay};
  opening();
}
document.addEventListener("DOMContentLoaded", boot);
if(document.readyState !== "loading") boot();
